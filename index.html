<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacer ♥ Kadir</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    color:white;
    text-align:center;
    background:
    radial-gradient(circle at 20% 10%,#ffb6d9 0%,transparent 30%),
    radial-gradient(circle at 90% 80%,#ff8fc4 0%,transparent 35%),
    linear-gradient(135deg,#ff4f9a,#ff78b6,#ffc1dc);
}

/* GİRİŞ EKRANI */
#login{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    linear-gradient(135deg,#ff4f9a,#ff9ac7,#ffd1e5);
}

.login-box{
    width:100%;
    max-width:380px;
    padding:35px 25px;
    border-radius:30px;

    background:rgba(255,255,255,.25);
    backdrop-filter:blur(15px);

    box-shadow:0 15px 50px rgba(130,0,70,.25);
}

.login-heart{
    font-size:65px;
    animation:heartBeat 1.5s infinite;
}

.login-box h1{
    margin:10px 0;
    font-size:30px;
}

.login-box p{
    margin-bottom:20px;
    color:#fff;
}

#password{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:15px;

    text-align:center;
    font-size:22px;
    letter-spacing:8px;

    background:white;
    color:#d93682;
}

#login button{
    width:100%;
    margin-top:15px;
    padding:14px;

    border:none;
    border-radius:15px;

    background:#ff3f91;
    color:white;
    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    box-shadow:0 6px 15px rgba(120,0,60,.2);
}

#login button:active{
    transform:scale(.97);
}

#error{
    margin-top:12px;
    color:#fff;
    font-weight:bold;
    display:none;
}

/* ANA SİTE */
#site{
    display:none;
}

/* KALP */
.top-heart{
    font-size:70px;
    animation:heartBeat 1.5s infinite;
}

@keyframes heartBeat{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.2)}
}

.container{
    position:relative;
    z-index:2;

    width:92%;
    max-width:680px;

    margin:30px auto;
    padding:30px 20px;

    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.4);
    border-radius:35px;

    backdrop-filter:blur(15px);
    box-shadow:0 15px 50px rgba(150,0,70,.25);
}

h1{
    font-size:42px;
    margin:5px 0;
    text-shadow:0 4px 15px rgba(120,0,60,.3);
}

.subtitle{
    font-size:17px;
    margin-top:8px;
}

.flowers{
    font-size:32px;
    margin:22px 0;
    letter-spacing:5px;
}

/* TARİH */
.date-card{
    background:rgba(255,255,255,.2);
    border-radius:25px;
    padding:22px;
    margin:20px 0;
}

.date{
    font-size:19px;
    font-weight:bold;
}

.counter-title{
    margin-top:15px;
}

.counter{
    margin-top:8px;
    font-size:20px;
    font-weight:bold;
}

/* BÖLÜMLER */
.section{
    margin-top:25px;
    padding:25px;

    background:rgba(255,255,255,.16);
    border-radius:25px;
}

.section h2{
    margin-bottom:18px;
    font-size:25px;
}

.message{
    text-align:left;
    line-height:1.8;
    font-size:15px;
}

.message p{
    margin-bottom:15px;
}

.quote{
